/* Prévia diária variável e cascata reversível de conteúdo */
.cascade-item{opacity:0;transform:translate3d(0,24px,0) scale(.99);filter:blur(2px);transition:opacity .48s ease,transform .62s cubic-bezier(.2,.75,.2,1),filter .48s ease;transition-delay:calc(var(--cascade-order,0)*58ms);will-change:opacity,transform}
.cascade-item.cascade-visible{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0);transition-delay:calc(var(--cascade-order,0)*58ms)}
.chart-controls{display:grid;gap:10px;margin:10px 0 12px}.chart-legend{display:flex;gap:7px;flex-wrap:wrap}.chart-legend button{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--bd);background:var(--card);color:var(--mut);font-size:11px;opacity:.58;transition:opacity .2s,transform .2s,border-color .2s,background .2s}.chart-legend button:hover{transform:translateY(-2px)}.chart-legend button.on{opacity:1;border-color:color-mix(in srgb,var(--ac) 42%,var(--bd));background:color-mix(in srgb,var(--ac) 8%,var(--card));color:var(--tx)}.chart-legend i{display:inline-block;width:15px;height:3px;border-radius:5px;background:#a78bfa}.chart-legend i.mid{background:#4f8cff}.chart-legend i.slow{background:#f2b45e}.chart-legend i.personal{background:#c8ff3a}.chart-hint{font-size:11px;color:var(--mut);margin:8px 2px 14px}.rg button{transition:transform .2s,background .2s,color .2s}.rg button:active,.chart-legend button:active{transform:scale(.96)}#cv{cursor:crosshair;outline:none}#cv:focus-visible{box-shadow:0 0 0 3px var(--focus)}
.daily-feature,.daily-challenge{position:relative;overflow:hidden;border:1px solid rgba(77,124,255,.24);background:linear-gradient(125deg,var(--card),rgba(77,124,255,.07),var(--card));}
.daily-feature:before,.daily-challenge:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,#c8ff3a,#4d7cff,#ff4fa3)}
.daily-feature h3,.daily-challenge h3{background:linear-gradient(90deg,#4d7cff,#9a68ff,#ff4fa3);-webkit-background-clip:text;background-clip:text;color:transparent}
.daily-challenge{box-shadow:0 8px 28px rgba(77,124,255,.08)}
@media(prefers-reduced-motion:reduce){.cascade-item,.cascade-item.cascade-visible{opacity:1;transform:none;filter:none;transition:none;will-change:auto}}


/* ===== DESIGN PASS · UI UX PRO MAX + TASTE SKILL ===== */
/* Direção: plataforma de aprendizagem premium, calma e editorial.
   Mantém a identidade violeta do English Hub e prioriza leitura, foco e previsibilidade. */
:root{
  --bg:#f7f7fc;
  --card:#fff;
  --card2:#f0eff9;
  --tx:#24213b;
  --mut:#77748f;
  --ac:#6754c9;
  --ac2:#d6ad61;
  --hov:#ebe9f7;
  --bd:#e5e3ef;
  --ok:#238b69;
  --bad:#c95d69;
  --sh:0 8px 26px rgba(37,31,78,.055);
  --focus:rgba(103,84,201,.22);
}
@media(prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
  --bg:#11111b;--card:#191927;--card2:#232337;--tx:#f0eef8;--mut:#aaa6bf;
  --ac:#a99af2;--ac2:#e4c27e;--hov:#2a2940;--bd:#343249;
  --ok:#63c6a0;--bad:#ee8790;--sh:0 10px 30px rgba(0,0,0,.16);
  --focus:rgba(169,154,242,.25);
 }
}
:root[data-theme="dark"]{
 --bg:#11111b;--card:#191927;--card2:#232337;--tx:#f0eef8;--mut:#aaa6bf;
 --ac:#a99af2;--ac2:#e4c27e;--hov:#2a2940;--bd:#343249;
 --ok:#63c6a0;--bad:#ee8790;--sh:0 10px 30px rgba(0,0,0,.16);
 --focus:rgba(169,154,242,.25);
}
html{scroll-behavior:smooth;scroll-padding-top:92px}
body{background:var(--bg);background-image:none;color:var(--tx);font-size:15px;line-height:1.6;letter-spacing:0}
.app{grid-template-columns:248px minmax(0,1fr) 288px;min-height:100dvh;background:var(--bg);background-image:none}

.lv{background:linear-gradient(118deg,#302b61 0%,#403875 58%,#455478 100%);border:1px solid rgba(255,255,255,.13);border-radius:20px;box-shadow:0 14px 32px rgba(42,35,92,.13);padding:clamp(20px,2.5vw,30px)}

.rb.now img{filter:drop-shadow(0 3px 6px rgba(103,84,201,.18));animation:none}

.lb{height:10px;border:0;background:var(--card2)}
.lb i{background:var(--ok);background-image:none;animation:none}
.sc3{gap:12px;margin:17px 0 24px}

.cw{gap:14px;padding:3px 2px 15px}
.cc{border:1px solid var(--bd);border-radius:15px;background:var(--card);box-shadow:var(--sh);animation:none;transition:transform .2s,border-color .2s,box-shadow .2s}
.cc:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--ac) 35%,var(--bd));box-shadow:0 12px 26px rgba(37,31,78,.08)}
.thb{background:var(--card2)!important}
.tag,.pill{font-weight:600}
.daily-feature,.daily-challenge{border:1px solid var(--bd);background:var(--card);box-shadow:var(--sh)}
.daily-feature:before,.daily-challenge:before{background:var(--ac)}
.daily-feature h3,.daily-challenge h3{background:none;color:var(--tx);-webkit-text-fill-color:currentColor}
.sci-card,.basic-lesson{transition:transform .18s,border-color .18s,background .18s}
.sci-card:hover,.basic-lesson:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--ac) 35%,var(--bd))}
.basic-hero,.sci-lesson-hero{background:linear-gradient(120deg,#302b61,#414b78);border:1px solid rgba(255,255,255,.13);border-radius:16px}
button,.btn,select{font:inherit;transition:background .18s,color .18s,border-color .18s,box-shadow .18s,transform .18s}
button,.btn{min-height:42px}
button:hover,.btn:hover{filter:none;box-shadow:0 4px 14px rgba(37,31,78,.08)}
button:active,.btn:active{transform:translateY(1px)}
button:focus-visible,.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input,textarea,select{min-height:44px;border:1px solid var(--bd);background:var(--card);border-radius:11px;color:var(--tx)}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px var(--focus)}
.pri{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:none}
.pri:hover{background:color-mix(in srgb,var(--ac) 90%,#000);filter:none}
.toast{border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
#cv{max-width:100%;border-radius:14px}
.chart-controls,.chart-legend{min-width:0}
.chart-legend button{min-height:40px}
#view .card:hover,#view .stat:hover,#view .sc:hover,#view .vc:hover{transform:none;box-shadow:var(--sh)}
#view .cc:hover,#view .sci-card:hover,#view .basic-lesson:hover{transform:translateY(-2px)}
/* Scroll reveal discreto: a animação informa hierarquia sem desfocar o conteúdo. */
.cascade-item{filter:none;transform:translate3d(0,16px,0);transition:opacity .38s ease,transform .45s cubic-bezier(.2,.75,.2,1);will-change:opacity,transform}
.cascade-item.cascade-visible{filter:none;transform:translate3d(0,0,0)}

/* Trophy room */

const lyricItems=s=>{const t=S.lyrics[s.id]||"";const L=t.split("\n").map(x=>x.trim()).filter(x=>x.split(/\s+/).length>=4);const W=[...new Set(t.toLowerCase().match(/[a-z’']{4,}/g)||[])];if(W.length<4)return[];return pick(L,8).map(ln=>{const ws=ln.split(/\s+/),c=ws.map((w,k)=>[w,k]).filter(x=>x[0].replace(/[^a-zA-Z’']/g,"").length>=4);if(!c.length)return null;const [w,k]=pick(c,1)[0],a=w.replace(/[^a-zA-Z’']/g,"").toLowerCase();ws[k]="_____";return{id:"l:"+s.id+":"+ln.slice(0,24),q:"Ouça a música e complete: "+ws.join(" "),a,opts:[a,...pick(W.filter(x=>x!==a),3)],note:"Frase completa: "+ln}}).filter(Boolean)};

const T1=["Primeiro Passo","Curioso","Explorador","Aprendiz","Desbravador","Praticante","Persistente","Observador","Ouvinte","Leitor","Falante Iniciante","Conversador","Viajante","Questionador","Contador de Histórias","Improvisador","Conector","Falante Confiante","Navegador de Contextos","Guardião da Base"],
T2=["Semi-fluente","Ouvido Afiado","Leitor Fluido","Debatedor","Narrador","Tradutor Natural","Mestre das Nuances","Sotaque em Formação","Caçador de Expressões","Negociador","Interlocutor","Pensador em Inglês","Dominador de Phrasal Verbs","Orador","Escritor Ágil","Mediador","Cidadão do Mundo","Falante Rebuscado","Estilista da Língua","Quase Nativo"],
T3=["Avançado","Lapidador","Retórico","Maestro das Palavras","Intérprete","Mentor","Poliglota em Ascensão","Arquiteto de Argumentos","Especialista","Estrategista","Orador Magnético","Crítico Literário","Voz Autoral","Dominador de Registros","Mestre dos Idiomatismos","Ouvido Absoluto","Embaixador","Sábio do Idioma","Lenda Viva","Quase Fluente"];
const xpTo=n=>Math.round(25*n+.28*n*n);
function lvInfo(){let n=0;while(n<301&&S.xp>=xpTo(n+1))n++;const A=n<=100?T1:n<=200?T2:T3,o=n<=100?0:n<=200?101:201,cur=xpTo(n),nx=n>=301?cur:xpTo(n+1);
 return{n,tier:n<=100?"Construção":n<=200?"Semi-fluente":n<=300?"Avançado":"Fluente",name:n>=301?"Fluente":A[Math.min(19,Math.floor((n-o)/5))],pct:n>=301?100:Math.round((S.xp-cur)/(nx-cur)*100),need:Math.max(0,nx-S.xp)}}
function grantXP(n,why){if(n<=0)return;const b=lvInfo().n;touch();S.xp+=n;S.dxp+=n;
 if(S.dxp>=GOAL&&S.gb!==today()){S.gb=today();S.xp+=45;S.trophies=S.trophies||{};S.trophies.goals=(S.trophies.goals||0)+1;toast("Meta diária batida! +45 XP de bônus")}
 const a=lvInfo();if(a.n>b){toast("Nível "+a.n+": "+a.name);boom()}else if(why)toast("+"+n+" XP · "+why);save();syncTrophies()}
const grant=(n,why,key)=>{S.once=S.once||{};if(S.once[key])return 0;S.once[key]=1;const earned=Math.round(n*XPM);grantXP(earned,why);return earned};
const XPK={multiple_choice:1,word_difference:1,context_interpretation:1.2,situational_choice:1.2,reading_comprehension:1.5,short_answer:1.5,sentence_transformation:1.8,error_correction:1.8},XPL={A1:8,A2:10,B1:14};
function award(it,combo,self){const base=Math.round((XPL[it.lv]||10)*(XPK[it.ty]||1)*XPM),seen=S.done[it.id]||0,red=!!S.weak[it.id],why=["base "+base];let m=1;
 if(red){m*=1.5;why.push("redenção ×1,5")}else if(seen){m*=.3;why.push("repetição ×0,3")}else why.push("primeira vez");
 if(combo>1){const c=Math.min(.5,(combo-1)*.1);m*=1+c;why.push("combo +"+Math.round(c*100)+"%")}
 const sm=1+Math.min(.5,S.streak*.02);if(sm>1){m*=sm;why.push("sequência +"+Math.round((sm-1)*100)+"%")}
 if(self){m*=.5;why.push("autoavaliado ×0,5")}let xp=Math.max(1,Math.round(base*m));
 if(seen){S.rxp=S.rd===today()?S.rxp||0:0;S.rd=today();xp=Math.max(0,Math.min(xp,Math.round(40*XPM)-S.rxp));S.rxp+=xp;if(!xp)why.push("limite diário de repetição")}
 grantXP(xp);return{xp,why:why.join(" · ")}}
/* quiz engine */
function quiz(items,title,back,onEnd){
 let i=0,hit=0,combo=0,gain=0;const xpStart=S.xp;
 const nz=x=>String(x).toLowerCase().replace(/[’‘]/g,"'").replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'ll\b/g," will").replace(/\bgonna\b/g,"going to").replace(/[^a-z0-9à-ú ]/g," ").replace(/\s+/g," ").trim();
 const isOk=(v,a)=>String(a).split("|").some(x=>nz(x)===nz(v));
 const finish=()=>{touch();const r=hit/items.length;S.trophies=S.trophies||{};S.trophies.sessions=(S.trophies.sessions||0)+1;S.trophies.sessionsByDay=S.trophies.sessionsByDay||{};S.trophies.sessionsByDay[today()]=(S.trophies.sessionsByDay[today()]||0)+1;if(r===1)S.trophies.perfectSessions=(S.trophies.perfectSessions||0)+1;if(new Date().getHours()>=23||new Date().getHours()<4){S.trophies.lateDays=S.trophies.lateDays||{};S.trophies.lateDays[today()]=1}let b=0,missionBonus=0;if(onEnd)missionBonus=Number(onEnd(r))||0;if(items.length>=5&&r>=.8){S.sxp=S.sd===today()?S.sxp||0:0;S.sd=today();b=Math.max(0,Math.min(Math.round((r===1?40:25)*XPM),Math.round(40*XPM)-S.sxp));S.sxp+=b;if(b)grantXP(b,r===1?"sessão perfeita":"sessão forte")}save();const L=lvInfo(),totalEarned=Math.max(0,S.xp-xpStart),dailyBonus=Math.max(0,totalEarned-gain-missionBonus-b);
  $("#view").innerHTML=`<div class="card"><h2>${title}: concluído</h2><p>Você acertou ${hit} de ${items.length} e ganhou <b>+${totalEarned} XP</b>${gain||missionBonus||b||dailyBonus?` (respostas +${gain}${missionBonus?`, missão +${missionBonus}`:""}${b?`, sessão +${b}`:""}${dailyBonus?`, meta diária +${dailyBonus}`:""})`:""}.</p><p>Nível ${L.n} · ${esc(L.name)} ${L.n>=301?" — você é fluente!":" — faltam "+L.need+" XP para o próximo nível."}</p><button class="pri" id="b1">Voltar</button> <button id="b2">Revisar erros</button></div>`;
  $("#b1").onclick=back;$("#b2").onclick=()=>go("review");if(r>=.7)boom()};
 const step=()=>{if(i>=items.length)return finish();
  const it=items[i],o=it.opts&&it.opts.length?sh(it.opts):null;
  $("#view").innerHTML=`<div class="card"><p class="mut">${esc(title)}, pergunta ${i+1} de ${items.length}${combo>1?" · combo ×"+combo:""}</p><h3 style="white-space:pre-line">${esc(it.q)}</h3>${o?`<div class="opts">${o.map((x,k)=>`<button data-k="${k}">${esc(x)}</button>`).join("")}</div>`:`<input id="ans" placeholder="Digite sua resposta em inglês" autocomplete="off"><button class="pri" id="ck">Conferir</button>`}<p id="fb" class="mut"></p></div><button id="ex">Sair</button>`;
  $("#ex").onclick=back;
  const result=(ok,btn)=>{touch();let msg;
   if(ok){hit++;combo++;S.trophies=S.trophies||{};S.trophies.correctAnswers=(S.trophies.correctAnswers||0)+1;S.trophies.bestCombo=Math.max(S.trophies.bestCombo||0,combo);if(!o)S.trophies.openAnswers=(S.trophies.openAnswers||0)+1;const r=award(it,combo);gain+=r.xp;msg=`Correto! +${r.xp} XP <span class="mut">(${r.why})</span>. `;S.done[it.id]=(S.done[it.id]||0)+1;const w=S.weak[it.id];if(w){w.ok=(w.ok||0)+1;if(w.ok>=2){delete S.weak[it.id];S.trophies.recoveredErrors=(S.trophies.recoveredErrors||0)+1}}}
   else{combo=0;if(btn)btn.classList.add("no");msg=`Quase! 0 XP. A resposta é “${esc(String(it.a).split("|")[0])}”. `;const w=S.weak[it.id]||{item:it,n:0,ok:0};w.n++;w.ok=0;w.item=it;S.weak[it.id]=w}
   save();$("#fb").innerHTML=msg+esc(it.note||"")+`<br><br>${!ok&&!o?'<button id="mk">Minha resposta também está certa</button> ':""}<button class="pri" id="nx">Continuar</button>`;
   $("#nx").onclick=()=>{i++;step()};const mk=$("#mk");if(mk)mk.onclick=()=>{hit++;combo=1;const r=award(it,1,true);gain+=r.xp;S.done[it.id]=(S.done[it.id]||0)+1;delete S.weak[it.id];save();mk.remove();toast("+"+r.xp+" XP")}};
  if(o)document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".opts button").forEach(x=>{x.disabled=true;if(o[x.dataset.k]===it.a)x.classList.add("ok")});result(o[b.dataset.k]===it.a,b)});
  else{const go1=()=>{const v=$("#ans").value.trim();if(!v)return;$("#ans").disabled=true;$("#ck").disabled=true;result(isOk(v,it.a))};$("#ck").onclick=go1;$("#ans").onkeydown=e=>{if(e.key==="Enter")go1()};$("#ans").focus()}
 };step();
}

Conversação|18|Concordar, discordar e reagir|B1|Reagir naturalmente a opiniões.#Concordo totalmente.=I couldn't agree more.;Não tenho tanta certeza.=I'm not so sure about that.;Faz sentido.=That makes sense.;Sério? Que doido!=No way! That's wild!;Eu pensava diferente.=I see it differently.;Pode ser.=I guess so.#Alguém diz: Tell me about it. O que significa?~Eu sei bem como é~Conte-me tudo~Fale mais baixo~Não me diga~Tell me about it = eu sei como é.#Vocês discutem qual jogo é melhor.~Você~Amigo~I couldn't agree more/I see it differently/That makes sense~Discorde sem ofender.
Conversação|19|Small talk|A2-B1|Bater papo curto sobre clima, trabalho e fim de semana.#E aí, como vão as coisas?=How's it going?;Nada demais, e você?=Not much, you?;Como foi seu fim de semana?=How was your weekend?;Está calor hoje, né?=It's hot today, isn't it?;Foi bom te ver.=It was nice seeing you.;A gente se fala.=Let's catch up soon.#Alguém diz: What's up? Qual resposta é natural?~Not much, what about you?~I am fine, thank you very much.~My name is Ana.~Nothing exists.~Responda curto e devolva a pergunta.#Você encontra um conhecido na rua.~Você~Conhecido~How's it going/Not much/Let's catch up~Faça small talk por trinta segundos.
Conversação|20|Preencher pausas e ganhar tempo|B1|Usar expressões para pensar enquanto fala.#Deixa eu pensar um segundo.=Let me think for a second.;Como é que eu falo...=How do I put this...;Na verdade...=Actually...;Tipo assim...=Like, you know...;Basicamente, o que eu quero dizer é isso.=Basically, what I mean is this.;Pode repetir, por favor?=Could you say that again?#Qual expressão ganha tempo?~Let me think for a second.~Shut up.~Goodbye.~Yes, no.~Pausas naturais ajudam.#Você explica uma ideia complexa em inglês.~Você~Ouvinte~Let me think/Actually/What I mean is~Explique sua rotina usando duas expressões de pausa.`;

/* Cascata de rolagem: observa o documento (o site não usa .app como scroll container),
   inclui conteúdo do painel lateral e atualiza alvos quando as views são recriadas. */
let cascadeObserver=null,cascadeMutationObserver=null,cascadeRefreshFrame=0;
function setupScrollCascade(){
 if(cascadeObserver)cascadeObserver.disconnect();
 const selectors="#view > *,#rail > *,#view .sc3 > .sc,#view .tl > div,#view .grid > *,#rail .tl > div";
 const nodes=[...document.querySelectorAll(selectors)];
 const unique=[...new Set(nodes)].filter(el=>!el.matches(".top")&&!el.closest(".daily-feature")||el.classList.contains("daily-feature"));
 if(!("IntersectionObserver" in window)){unique.forEach(el=>el.classList.add("cascade-visible"));return}
 cascadeObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{
  entry.target.classList.toggle("cascade-visible",entry.isIntersecting);
 }),{root:null,threshold:.04,rootMargin:"0px 0px -8% 0px"});
 unique.forEach((el,i)=>{el.classList.add("cascade-item");el.style.setProperty("--cascade-order",Math.min(i%10,9));cascadeObserver.observe(el)});
}
function watchCascadeContent(){
 if(cascadeMutationObserver)cascadeMutationObserver.disconnect();
 const targets=[$("#view"),$("#rail")].filter(Boolean);
 if(!("MutationObserver" in window)||!targets.length)return;
 cascadeMutationObserver=new MutationObserver(()=>{if(cascadeRefreshFrame)return;cascadeRefreshFrame=requestAnimationFrame(()=>{cascadeRefreshFrame=0;setupScrollCascade()})});
 targets.forEach(el=>cascadeMutationObserver.observe(el,{childList:true,subtree:true}));
}
watchCascadeContent();

 {unit:"Começando do zero",name:"Como montar uma frase",level:"A1",goal:"Entender a ordem mais comum das palavras em inglês.",rule:"Em uma frase afirmativa simples, a ordem mais comum é SUBJECT + VERB + COMPLEMENT. Em português, às vezes mudamos a ordem com liberdade. Em inglês, a posição das palavras costuma ser mais fixa.",examples:[["I like music.","Eu gosto de música."],["She studies English.","Ela estuda inglês."],["We live in Brazil.","Nós moramos no Brasil."]],tip:"Pense em blocos: quem + faz o quê + complemento. Não tente traduzir cada palavra e reorganizar no impulso.",sound:"I want coffee → “ai uónt cófi”. O importante é reconhecer os blocos, não imitar um sotaque perfeito.",qs:[["Choose the correct sentence:",["I coffee want.","I want coffee.","Want I coffee."],1,"A estrutura básica é sujeito (I) + verbo (want) + complemento (coffee)."],["How do you say “Ela gosta de música”?",["She like music.","She likes music.","Likes she music."],1,"She é terceira pessoa do singular. No Simple Present, o verbo normalmente recebe -s: likes."]]},
 {unit:"Começando do zero",name:"Pronomes e verbo TO BE",level:"A1",goal:"Dizer quem você é, como está e onde está.",rule:"TO BE significa ser ou estar. Use AM com I, IS com he/she/it e ARE com you/we/they. Aprenda como blocos prontos, sem decorar uma tabela enorme.",examples:[["I am tired.","Estou cansado."],["She is a doctor.","Ela é médica."],["They are at home.","Eles estão em casa."]],tip:"Na fala, as formas encurtam: I am → I'm; you are → you're; he is → he's. Essas contrações são normais e muito frequentes.",sound:"I'm ready soa aproximadamente “aim rédi”. You're welcome soa “iór uélcam”.",qs:[["Complete: “They ___ happy.”",["am","is","are"],2,"They combina com are."],["Qual é a forma contraída de “I am”?",["I'm","I's","I're"],0,"I am vira I'm. A contração é comum tanto na fala quanto na escrita informal."]]},
 {unit:"Frases que você usa",name:"Negativas e perguntas com TO BE",level:"A1",goal:"Perguntar e negar sem inverter tudo por tentativa.",rule:"Para negar, coloque NOT depois do verbo: She is not tired. Para perguntar, leve AM/IS/ARE para antes do sujeito: Are you ready? Não use DO com o verbo TO BE.",examples:[["He isn't busy.","Ele não está ocupado."],["Are you okay?","Você está bem?"],["Is she your sister?","Ela é sua irmã?"]],tip:"Respostas curtas: Yes, I am. / No, I'm not. Evite responder apenas “Yes” quando quiser soar mais natural e claro.",sound:"Is he okay? Na fala rápida, as palavras se conectam. Ouça a frase como um bloco.",qs:[["Choose the correct question:",["You are ready?","Are you ready?","Do you are ready?"],1,"Com TO BE, inverta o verbo e o sujeito: Are + you + ready?"],["Complete: “I ___ not hungry.”",["do","am","is"],1,"A negativa de TO BE é formada com o próprio verbo: I am not."]]},
 {unit:"Frases que você usa",name:"Simple Present",level:"A1",goal:"Falar de rotina, hábitos e fatos.",rule:"Use o Simple Present para hábitos e fatos: I work, you study, we play. Com HE, SHE e IT, normalmente acrescente -S ou -ES: he works, she watches. O verbo muda, mas só nesse caso.",examples:[["I work every day.","Eu trabalho todos os dias."],["He plays football.","Ele joga futebol."],["She watches movies.","Ela assiste a filmes."]],tip:"Não diga “she work”. Lembre do S em he/she/it: She likes, he wants, it works.",sound:"He works pode soar como “hi uârks”. O -s final é importante para entender quem é o sujeito.",qs:[["Choose the correct option:",["My brother live here.","My brother lives here.","My brother living here."],1,"My brother equivale a he. Por isso, lives recebe -s."],["Which sentence describes a habit?",["I am sleeping now.","I go to work every morning.","I went yesterday."],1,"Every morning indica rotina, então usamos Simple Present."]]},

 {unit:"Futuro na prática",name:"WILL: decisões e previsões",level:"A2",goal:"Falar sobre decisões, promessas e previsões.",rule:"WILL + verbo na forma base. Use para decisões tomadas na hora, promessas e previsões: I'll help you. I think it will rain. Na negativa: won't. Em perguntas: Will you come?",examples:[["I'll call you later.","Vou te ligar mais tarde."],["I think it will rain.","Acho que vai chover."],["I won't forget.","Não vou esquecer."],["Will you help me?","Você vai me ajudar?"]],tip:"Depois de WILL, não coloque TO nem -S: She will come. A contração mais comum é I'll, you'll, he'll, we'll.",sound:"I'll soa como “áil”. Won't soa aproximadamente “uôunt”. A forma contraída aparece o tempo todo em conversas.",qs:[["Complete: “I think she ___ like this movie.”",["will","does","is"],0,"WILL + verbo base expressa uma previsão."],["Choose the correct sentence:",["He will goes.","He will to go.","He will go."],2,"Depois de will, o verbo fica na forma base: go."]]},

  <section class="sci-lesson">
   <div class="sci-lesson-hero"><span class="tag">ACADEMIC READING · LEVEL B2–C1</span><h2>Missão 01 · Diabetes: reading the evidence</h2><p>Você não vai apenas traduzir. Vai interpretar, analisar a construção do inglês acadêmico e questionar a força das conclusões.</p><div class="sci-progress"><span id="sci-progress-fill"></span></div><small id="sci-progress-label">0 de 7 desafios concluídos</small></div>
   <div class="sci-panel" data-sci-step="0"><h3>1. Read the paragraph</h3><p class="mut">Teaching passage adapted from the findings of the BMJ systematic review below. This is an instructional paraphrase, not a verbatim quotation.</p><blockquote class="sci-passage"><p>This systematic review compared the benefits and potential harms of several medicines used to treat adults with type 2 diabetes. The researchers analysed evidence from 816 trials involving more than 470,000 participants. The findings suggest that some drug classes may reduce cardiovascular and kidney complications, although the balance of benefits and risks differs across treatments and patient groups.</p></blockquote><p class="mut"><b>Seu desafio:</b> leia primeiro em inglês, sem traduzir palavra por palavra. Depois identifique a pergunta, o método, os resultados e as ressalvas.</p></div>
   <div class="sci-panel" data-sci-step="1"><h3>2. Dissect the academic English</h3><div class="sci-analysis" id="sci-analysis">
    <article class="sci-sentence"><span class="tag">Sentence 01 · Purpose</span><p class="sci-en">“This systematic review compared the benefits and potential harms…”</p><p><b>Por que essa estrutura?</b> O sujeito é “This systematic review”. O verbo no simple past, “compared”, descreve o objetivo executado pelos autores. A forma direta sujeito + verbo + objeto deixa explícito o que a pesquisa fez.</p><p class="mut"><b>Desafio de inglês:</b> “potential” modifica “harms”. O autor evita afirmar que todos os danos ocorreram, indicando possibilidade, não certeza.</p></article>
    <article class="sci-sentence"><span class="tag">Sentence 02 · Method</span><p class="sci-en">“The researchers analysed evidence from 816 trials involving more than 470,000 participants.”</p><p><b>Por que essa estrutura?</b> “Analysed” está no simple past porque relata uma etapa concluída. “Involving more than 470,000 participants” é uma oração reduzida com particípio presente, que acrescenta informação sobre “trials” sem criar uma nova frase completa.</p><p class="mut"><b>Desafio de inglês:</b> “involving” não significa que os participantes estão realizando a análise. O termo caracteriza os ensaios clínicos.</p></article>
    <article class="sci-sentence"><span class="tag">Sentence 03 · Interpretation</span><p class="sci-en">“The findings suggest that some drug classes may reduce…”</p><p><b>Por que essa estrutura?</b> “Suggest that” introduz uma interpretação baseada nos resultados. “May reduce” combina um modal de possibilidade com o verbo na forma base. Essa escolha demonstra cautela científica: os autores não transformam evidência em promessa absoluta.</p><p class="mut"><b>Desafio de inglês:</b> compare “may reduce” com “reduces”. A primeira formulação sinaliza incerteza; a segunda pode soar como uma afirmação geral mais forte.</p></article>
    <article class="sci-sentence"><span class="tag">Sentence 04 · Contrast</span><p class="sci-en">“…although the balance of benefits and risks differs across treatments and patient groups.”</p><p><b>Por que essa estrutura?</b> “Although” introduz uma concessão: mesmo havendo resultados favoráveis, eles não são iguais em todos os cenários. O simple present “differs” expressa uma interpretação geral dos dados. “Across” indica variação entre diferentes tratamentos e grupos.</p><p class="mut"><b>Desafio de inglês:</b> a oração com “although” limita a leitura da afirmação anterior. Ela impede que o leitor conclua que todos os medicamentos têm o mesmo efeito.</p></article>

   <div class="sci-panel" data-sci-step="3"><h3>4. Critical appraisal · Think like a researcher</h3><p class="sci-en">“The findings suggest that some drug classes may reduce cardiovascular and kidney complications…”</p><p><b>Questão crítica:</b> essa frase permite concluir que qualquer pessoa com diabetes deve usar essas classes de medicamentos?</p><p>Não. O artigo compara efeitos em grupos de estudos e relata benefícios e riscos relativos. A decisão clínica depende de características individuais, comorbidades, contraindicações, desfechos e qualidade da evidência. Uma revisão sistemática fortalece a síntese, mas não elimina limitações dos estudos incluídos.</p><div class="sci-critical-grid"><div><b>Strength</b><p>Grande volume de evidências: 816 ensaios e mais de 470 mil participantes.</p></div><div><b>Limitation to examine</b><p>Os autores identificaram ensaios com risco de viés. Quantidade de estudos não significa que todos tenham a mesma qualidade.</p></div><div><b>Language signal</b><p>“Suggest”, “may” e “probably” comunicam graus de cautela. Não são palavras decorativas.</p></div></div><div class="sci-writing"><label for="sci-writing-answer"><b>Writing task (in English)</b></label><p>In two or three sentences, explain one strength and one limitation of this evidence. Use “although” or “however” to contrast your ideas.</p><textarea id="sci-writing-answer" rows="4" placeholder="Although the review included..."></textarea><button class="btn" id="sci-model">Show model answer</button><div id="sci-model-answer" hidden><p class="sci-en">Although the review included a large number of trials and participants, the certainty of the evidence varied across outcomes. Therefore, the results should be interpreted alongside the risk of bias and the clinical characteristics of each patient.</p><p class="mut">Observe: “Although” apresenta a concessão; “therefore” introduz uma consequência lógica. “Should be interpreted” usa voz passiva para enfatizar como os resultados devem ser avaliados, e não quem deve avaliá-los.</p></div><button class="btn pri" id="sci-writing-done">Complete writing challenge · +${Math.round(20*XPM)} XP</button><small id="sci-writing-status"></small></div></div>

 const cf=$("#cf");if(cf)cf.onchange=e=>{const fl=e.target.files[0];if(!fl)return;if(fl.size>10*1024*1024){$("#cm").textContent="Arquivo muito grande. O limite do banco de conteúdo é 10 MB.";e.target.value="";return}const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),n=fixCourse(d);COURSE=d;try{localStorage.setItem("eih_c",JSON.stringify(d))}catch(x){toast("Importado, mas sem espaço para salvar no navegador")}toast(d.exercises.length+" exercícios importados, "+n+" correções");V.real()}catch(x){$("#cm").textContent="Arquivo inválido: "+x.message}};r.readAsText(fl)}};
go("home");
</script></body></html>
